[package]
name = "kayfabe"
version = "0.1.0"
edition = "2021"
authors = ["ShreyeshArangat"]
description = "AI-enhanced CLI task manager with git worktree orchestration"
license = "MIT"
repository = "https://github.com/shreyesharangath/kayfabe"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive", "cargo"] }

# Database
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }

# TUI
ratatui = "0.25"
crossterm = "0.27"

# Git operations
git2 = "0.18"

# Serialization & Time
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
dirs = "5.0"

# Interactive CLI
inquire = "0.7"

[dev-dependencies]
tempfile = "3.8"
serial_test = "3.0"

[[bin]]
name = "kayfabe"
path = "src/main.rs"
